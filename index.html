<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Для тебя 💕</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Comfortaa:wght@300;400;600;700&family=Marck+Script&display=swap');

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            -webkit-tap-highlight-color: transparent;
        }

        html, body {
            height: 100%;
            overflow: hidden;
        }

        body {
            font-family: 'Comfortaa', cursive;
            background: linear-gradient(135deg, #ffe0ec 0%, #ffd1e3 30%, #ffc4dc 60%, #ffb8d4 100%);
            color: #6b2c44;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            position: relative;
            user-select: none;
        }

        /* ===== ПАДАЮЩИЕ СЛОВА ===== */
        .falling-words-container {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            z-index: 100;
            overflow: hidden;
        }

        .falling-word {
            position: absolute;
            top: -60px;
            font-family: 'Marck Script', cursive;
            font-size: 2rem;
            color: #d63384;
            text-shadow: 0 0 8px rgba(255, 255, 255, 1),
                         0 0 15px rgba(255, 255, 255, 0.8),
                         0 0 25px rgba(255, 182, 193, 0.9);
            opacity: 0;
            white-space: nowrap;
            animation: fall linear forwards;
            font-weight: 600;
            z-index: 100;
        }

        @keyframes fall {
            0% {
                transform: translateY(-60px) translateX(0) rotate(0deg);
                opacity: 0;
            }
            10% { opacity: 1; }
            85% { opacity: 1; }
            100% {
                transform: translateY(105vh) translateX(60px) rotate(18deg);
                opacity: 0;
            }
        }

        /* ===== ВСПЛЫВАЮЩИЕ СЛОВА (при листании) ===== */
        .pop-word {
            position: fixed;
            font-family: 'Marck Script', cursive;
            font-size: 1.8rem;
            color: #ff2d87;
            text-shadow: 0 0 12px rgba(255, 255, 255, 1),
                         0 0 25px rgba(255, 105, 180, 0.9),
                         0 0 40px rgba(255, 182, 193, 0.7);
            pointer-events: none;
            z-index: 200;
            white-space: nowrap;
            animation: popWord 2.5s ease-out forwards;
            font-weight: 700;
        }

        @keyframes popWord {
            0% {
                opacity: 0;
                transform: translate(-50%, -50%) scale(0.3) rotate(-10deg);
            }
            20% {
                opacity: 1;
                transform: translate(-50%, -50%) scale(1.15) rotate(3deg);
            }
            35% {
                transform: translate(-50%, -50%) scale(1) rotate(0deg);
            }
            75% {
                opacity: 1;
                transform: translate(-50%, -80%) scale(1) rotate(0deg);
            }
            100% {
                opacity: 0;
                transform: translate(-50%, -180%) scale(0.8) rotate(-5deg);
            }
        }

        /* ===== ВЗРЫВ СЕРДЕЧЕК ===== */
        .heart-burst {
            position: fixed;
            font-size: 1.8rem;
            pointer-events: none;
            z-index: 250;
            animation: burst 1.6s ease-out forwards;
            will-change: transform, opacity;
        }

        @keyframes burst {
            0% {
                opacity: 1;
                transform: translate(-50%, -50%) scale(0.3) rotate(0deg);
            }
            60% {
                opacity: 1;
            }
            100% {
                opacity: 0;
                transform: translate(calc(-50% + var(--tx)), calc(-50% + var(--ty))) scale(1.3) rotate(var(--rot));
            }
        }

        /* ===== ПЛАВАЮЩИЕ СЕРДЕЧКИ ФОНА ===== */
        .bg-heart {
            position: fixed;
            font-size: 1.5rem;
            opacity: 0.2;
            pointer-events: none;
            z-index: 1;
            animation: floatUp linear infinite;
        }

        @keyframes floatUp {
            from {
                transform: translateY(100vh) rotate(0deg);
                opacity: 0;
            }
            10% { opacity: 0.25; }
            90% { opacity: 0.25; }
            to {
                transform: translateY(-100px) rotate(360deg);
                opacity: 0;
            }
        }

        /* ===== КНИГА ===== */
        .book {
            position: relative;
            z-index: 10;
            width: 100%;
            max-width: 560px;
            height: 100%;
            display: flex;
            flex-direction: column;
            justify-content: center;
            padding: 20px;
        }

        .book-header {
            text-align: center;
            margin-bottom: 10px;
            flex-shrink: 0;
        }

        .book-header h1 {
            font-family: 'Marck Script', cursive;
            font-size: clamp(1.8rem, 6vw, 2.6rem);
            color: #c2185b;
            text-shadow: 1px 1px 10px rgba(255, 255, 255, 0.9);
        }

        .pages {
            position: relative;
            flex: 1;
            display: flex;
            align-items: center;
            justify-content: center;
            min-height: 0;
        }

        .page {
            position: absolute;
            inset: 0;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: 18px;
            opacity: 0;
            transform: translateX(60px) scale(0.95);
            pointer-events: none;
            transition: opacity 0.55s ease, transform 0.55s ease;
            padding: 10px;
        }

        .page.active {
            opacity: 1;
            transform: translateX(0) scale(1);
            pointer-events: auto;
        }

        .page.exit-left {
            opacity: 0;
            transform: translateX(-60px) scale(0.95);
        }

        .page.exit-right {
            opacity: 0;
            transform: translateX(60px) scale(0.95);
        }

        .photo-card {
            background: rgba(255, 255, 255, 0.65);
            backdrop-filter: blur(15px);
            -webkit-backdrop-filter: blur(15px);
            border-radius: 28px;
            padding: 18px 18px 24px;
            box-shadow: 0 20px 50px rgba(214, 51, 132, 0.28),
                        0 0 0 1px rgba(255, 255, 255, 0.9) inset;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 18px;
            max-height: 100%;
            transition: transform 0.4s ease, box-shadow 0.4s ease;
        }

        .photo-card:hover {
            transform: translateY(-5px);
            box-shadow: 0 28px 65px rgba(214, 51, 132, 0.4),
                        0 0 0 1px rgba(255, 255, 255, 1) inset;
        }

        .photo-card img {
            width: 100%;
            max-height: 52vh;
            object-fit: cover;
            border-radius: 20px;
            box-shadow: 0 12px 32px rgba(214, 51, 132, 0.3);
            display: block;
        }

        .page-text {
            font-family: 'Marck Script', cursive;
            font-size: clamp(1.4rem, 4.5vw, 2rem);
            color: #b1275e;
            text-align: center;
            line-height: 1.35;
            text-shadow: 1px 1px 8px rgba(255, 255, 255, 0.9);
            padding: 0 6px;
        }

        /* ===== УПРАВЛЕНИЕ ===== */
        .controls {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 18px;
            margin-top: 12px;
            flex-shrink: 0;
            z-index: 20;
        }

        .nav-btn {
            width: 56px;
            height: 56px;
            border-radius: 50%;
            border: none;
            background: rgba(255, 255, 255, 0.75);
            backdrop-filter: blur(10px);
            -webkit-backdrop-filter: blur(10px);
            color: #d63384;
            font-size: 1.6rem;
            font-weight: 700;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            box-shadow: 0 10px 25px rgba(214, 51, 132, 0.25),
                        0 0 0 1px rgba(255, 255, 255, 0.9) inset;
            transition: transform 0.25s ease, background 0.25s ease, box-shadow 0.25s ease;
        }

        .nav-btn:hover {
            background: rgba(255, 255, 255, 0.95);
            transform: scale(1.1);
            box-shadow: 0 14px 32px rgba(214, 51, 132, 0.4),
                        0 0 0 1px rgba(255, 255, 255, 1) inset;
        }

        .nav-btn:active {
            transform: scale(0.9);
        }

        .nav-btn:disabled {
            opacity: 0.35;
            cursor: not-allowed;
            transform: none;
        }

        .dots {
            display: flex;
            gap: 8px;
            align-items: center;
        }

        .dot {
            width: 10px;
            height: 10px;
            border-radius: 50%;
            background: rgba(214, 51, 132, 0.3);
            transition: all 0.3s ease;
            cursor: pointer;
        }

        .dot.active {
            background: #d63384;
            width: 26px;
            border-radius: 6px;
            box-shadow: 0 0 10px rgba(214, 51, 132, 0.6);
        }

        .page-counter {
            text-align: center;
            font-size: 0.85rem;
            color: #a13a5e;
            opacity: 0.8;
            margin-top: 8px;
            letter-spacing: 1px;
            font-weight: 400;
        }

        .final-page {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: 20px;
            text-align: center;
            padding: 30px;
            background: rgba(255, 255, 255, 0.6);
            backdrop-filter: blur(15px);
            -webkit-backdrop-filter: blur(15px);
            border-radius: 28px;
            box-shadow: 0 20px 50px rgba(214, 51, 132, 0.28),
                        0 0 0 1px rgba(255, 255, 255, 0.9) inset;
            max-width: 460px;
        }

        .final-page p {
            font-family: 'Marck Script', cursive;
            font-size: clamp(1.4rem, 4.5vw, 2rem);
            color: #c2185b;
            line-height: 1.5;
            text-shadow: 1px 1px 10px rgba(255, 255, 255, 0.9);
        }

        .final-page .hearts {
            font-size: 2rem;
            animation: pulse 2s ease-in-out infinite;
        }

        @keyframes pulse {
            0%, 100% { transform: scale(1); }
            50% { transform: scale(1.15); }
        }

        .swipe-hint {
            position: fixed;
            bottom: 12px;
            left: 50%;
            transform: translateX(-50%);
            font-size: 0.75rem;
            color: #a13a5e;
            opacity: 0.7;
            z-index: 20;
            letter-spacing: 1px;
            animation: fadeHint 3s ease-in-out infinite;
        }

        @keyframes fadeHint {
            0%, 100% { opacity: 0.4; }
            50% { opacity: 0.9; }
        }

        @media (max-width: 600px) {
            .book { padding: 12px; }
            .photo-card { padding: 14px 14px 18px; border-radius: 22px; }
            .photo-card img { max-height: 45vh; }
            .nav-btn { width: 50px; height: 50px; font-size: 1.4rem; }
            .falling-word { font-size: 1.5rem; }
            .pop-word { font-size: 1.4rem; }
        }
    </style>
</head>
<body>

    <div class="falling-words-container" id="fallingWords"></div>

    <div class="book">
        <div class="book-header">
            <h1>Для тебя 💗</h1>
        </div>

        <div class="pages" id="pages"></div>

        <div class="controls">
            <button class="nav-btn" id="prevBtn" aria-label="Назад">‹</button>
            <div class="dots" id="dots"></div>
            <button class="nav-btn" id="nextBtn" aria-label="Вперёд">›</button>
        </div>

        <div class="page-counter" id="counter"></div>
    </div>

    <div class="swipe-hint">← листай →</div>

    <script>
        // ===== Страницы =====
        const pagesData = [
            { img: 'https://i.ibb.co/nMnd4PFH/IMG-20261012-020859-152.jpg', text: 'Ты невероятно красивая ✨' },
            { img: 'https://i.ibb.co/6K7fFr1/IMG-20261012-020903-183.jpg', text: 'С тобой так комфортно и тепло 🌸' },
            { img: 'https://i.ibb.co/fdQNf71X/IMG-20261012-020904-381.jpg', text: 'Ты самая добрая на свете 💖' },
            { img: 'https://i.ibb.co/zW1LbWF4/IMG-20261012-020906-109.jpg', text: 'Твоя улыбка согревает сердце 🌷' },
            { img: 'https://i.ibb.co/DD1yvmyq/IMG-20261012-020906-955.jpg', text: 'Ты — моё вдохновение 💫' },
            { img: 'https://i.ibb.co/20SyDNJm/IMG-20261012-020907-998.jpg', text: 'Ты — настоящее чудо 🦋' }
        ];

        const pagesContainer = document.getElementById('pages');
        const dotsContainer = document.getElementById('dots');
        const counterEl = document.getElementById('counter');
        const prevBtn = document.getElementById('prevBtn');
        const nextBtn = document.getElementById('nextBtn');

        pagesData.forEach((data, i) => {
            const page = document.createElement('div');
            page.className = 'page' + (i === 0 ? ' active' : '');
            page.innerHTML = `
                <div class="photo-card">
                    <img src="${data.img}" alt="Фото ${i + 1}">
                    <p class="page-text">${data.text}</p>
                </div>
            `;
            pagesContainer.appendChild(page);

            const dot = document.createElement('div');
            dot.className = 'dot' + (i === 0 ? ' active' : '');
            dot.dataset.index = i;
            dot.addEventListener('click', () => goToPage(i));
            dotsContainer.appendChild(dot);
        });

        const finalPage = document.createElement('div');
        finalPage.className = 'page';
        finalPage.innerHTML = `
            <div class="final-page">
                <p>Спасибо, что ты есть.<br>Ты делаешь этот мир добрее и красивее 🌹</p>
                <div class="hearts">💕 💗 💕</div>
            </div>
        `;
        pagesContainer.appendChild(finalPage);

        const allPages = document.querySelectorAll('.page');
        const allDots = document.querySelectorAll('.dot');
        const totalPages = allPages.length;
        let currentPage = 0;

        function goToPage(index) {
            if (index < 0 || index >= totalPages || index === currentPage) return;

            const oldPage = allPages[currentPage];
            const newPage = allPages[index];
            const direction = index > currentPage ? 'right' : 'left';

            oldPage.classList.remove('active');
            oldPage.classList.add(direction === 'right' ? 'exit-left' : 'exit-right');
            setTimeout(() => oldPage.classList.remove('exit-left', 'exit-right'), 600);

            newPage.classList.add('active');
            currentPage = index;

            // 🎉 Взрыв сердечек и всплывающие слова!
            celebrate();

            updateUI();
        }

        function updateUI() {
            allDots.forEach((dot, i) => dot.classList.toggle('active', i === currentPage));
            counterEl.textContent = `${currentPage + 1} / ${totalPages}`;
            prevBtn.disabled = currentPage === 0;
            nextBtn.disabled = currentPage === totalPages - 1;
        }

        prevBtn.addEventListener('click', () => goToPage(currentPage - 1));
        nextBtn.addEventListener('click', () => goToPage(currentPage + 1));

        document.addEventListener('keydown', (e) => {
            if (e.key === 'ArrowLeft') goToPage(currentPage - 1);
            if (e.key === 'ArrowRight') goToPage(currentPage + 1);
        });

        // Свайпы
        let touchStartX = 0;
        document.addEventListener('touchstart', (e) => {
            touchStartX = e.changedTouches[0].screenX;
        }, { passive: true });

        document.addEventListener('touchend', (e) => {
            const diff = touchStartX - e.changedTouches[0].screenX;
            if (Math.abs(diff) > 50) {
                if (diff > 0) goToPage(currentPage + 1);
                else goToPage(currentPage - 1);
            }
        }, { passive: true });

        updateUI();

        // =========================================================
        //  🎉 ВЗРЫВ СЕРДЕЧЕК И ВСПЛЫВАЮЩИЕ ТЁПЛЫЕ СЛОВА
        // =========================================================

        // Огромный список тёплых слов и фраз
        const popWords = [
            'ты очень красивая 💖',
            'ты комфортная 🌸',
            'ты добрая 💗',
            'ты нежная 🌷',
            'ты тёплая ☀️',
            'ты милая 🎀',
            'ты чудесная ✨',
            'ты искренняя 💫',
            'ты заботливая 💕',
            'ты особенная 🌹',
            'ты любимая 💞',
            'ты счастье 🍀',
            'ты солнышко ☀️',
            'ты вдохновение 🌟',
            'ты самая лучшая 💎',
            'ты умница 🦋',
            'ты ангел 👼',
            'ты радость 🌈',
            'ты моё чудо 🦄',
            'ты прекрасна 🌺',
            'ты моя вселенная 🌌',
            'ты лучшая на свете 💝',
            'ты душевная 🌸',
            'ты ласковая 💗',
            'ты удивительная ✨',
            'ты светлая ☀️',
            'ты родная 💖',
            'ты неотразима 💃',
            'ты очаровательна 🌹',
            'ты невероятна 💫',
            'ты талантливая 🎨',
            'ты умная 🧠',
            'ты смелая 🦁',
            'ты сильная 💪',
            'ты нежность 💐',
            'ты гармония 🕊️',
            'ты красота 🌸',
            'ты нежный цветочек 🌷',
            'ты моя звёздочка ⭐',
            'ты самая родная 💗',
            'ты меня вдохновляешь 🌟',
            'ты моё сокровище 💎',
            'ты делаешь меня счастливым 💕',
            'ты нужна мне 💖',
            'ты моё сердце 💓',
            'ты мой мир 🌍',
            'ты — моё всё 💗'
        ];

        const heartEmojis = ['💗', '💕', '💖', '💘', '💝', '🌸', '🌷', '✨', '💞', '💓', '🩷', '❤️', '💓', '🌺'];

        // Всплывающее тёплое слово
        function showPopWord(x, y) {
            const el = document.createElement('div');
            el.className = 'pop-word';
            el.textContent = popWords[Math.floor(Math.random() * popWords.length)];
            el.style.left = x + 'px';
            el.style.top = y + 'px';
            // Случайный размер
            el.style.fontSize = (1.5 + Math.random() * 1) + 'rem';
            document.body.appendChild(el);
            setTimeout(() => el.remove(), 2600);
        }

        // Взрыв сердечек из точки
        function heartBurst(x, y, count = 22) {
            for (let i = 0; i < count; i++) {
                const heart = document.createElement('div');
                heart.className = 'heart-burst';
                heart.textContent = heartEmojis[Math.floor(Math.random() * heartEmojis.length)];
                heart.style.left = x + 'px';
                heart.style.top = y + 'px';

                // Разлёт по окружности
                const angle = (Math.PI * 2 * i) / count + (Math.random() - 0.5) * 0.5;
                const distance = 100 + Math.random() * 220;
                const tx = Math.cos(angle) * distance;
                const ty = Math.sin(angle) * distance - 80;

                heart.style.setProperty('--tx', tx + 'px');
                heart.style.setProperty('--ty', ty + 'px');
                heart.style.setProperty('--rot', (Math.random() * 720 - 360) + 'deg');

                heart.style.fontSize = (1 + Math.random() * 1.8) + 'rem';
                heart.style.animationDuration = (1.2 + Math.random() * 0.8) + 's';
                heart.style.animationDelay = (Math.random() * 0.15) + 's';

                document.body.appendChild(heart);
                setTimeout(() => heart.remove(), 2200);
            }
        }

        // Праздник при перелистывании — сердечки + слова!
        function celebrate() {
            const cx = window.innerWidth / 2;
            const cy = window.innerHeight / 2;

            // Большой взрыв сердечек из центра
            heartBurst(cx, cy, 30);

            // Дополнительные взрывы по углам
            setTimeout(() => heartBurst(cx * 0.4, cy * 0.7, 12), 120);
            setTimeout(() => heartBurst(cx * 1.6, cy * 0.7, 12), 220);
            setTimeout(() => heartBurst(cx, cy * 0.4, 14), 320);

            // Всплывают 3 тёплых слова
            showPopWord(cx, cy - 20);
            setTimeout(() => showPopWord(cx * 0.6 + Math.random() * 60, cy + 40), 250);
            setTimeout(() => showPopWord(cx * 1.4 - Math.random() * 60, cy + 40), 500);
        }

        // Тёплое слово и сердечки при клике В ЛЮБОМ МЕСТЕ экрана
        document.addEventListener('click', (e) => {
            // Игнорируем клики по кнопкам — для них своя логика
            if (e.target.closest('.nav-btn') || e.target.closest('.dot')) return;

            heartBurst(e.clientX, e.clientY, 14);
            showPopWord(e.clientX, e.clientY);
        });

        // ===== ПАДАЮЩИЕ СЛОВА =====
        const words = popWords;

        const fallingContainer = document.getElementById('fallingWords');

        function createFallingWord() {
            const word = document.createElement('div');
            word.className = 'falling-word';
            word.textContent = words[Math.floor(Math.random() * words.length)];
            word.style.left = (Math.random() * 80) + '%';

            const duration = 6 + Math.random() * 5;
            word.style.animationDuration = duration + 's';
            word.style.fontSize = (1.3 + Math.random() * 1.2) + 'rem';

            fallingContainer.appendChild(word);
            setTimeout(() => word.remove(), duration * 1000);
        }

        function spawnWords() {
            for (let i = 0; i < 3; i++) {
                setTimeout(createFallingWord, i * 700);
            }
        }

        spawnWords();
        setInterval(spawnWords, 2800);

        // ===== Плавающие сердечки фона =====
        const hearts = ['💗', '💕', '🌸', '✨', '🌷', '💖', '🦋', '💫'];

        function createBgHeart() {
            const heart = document.createElement('div');
            heart.className = 'bg-heart';
            heart.textContent = hearts[Math.floor(Math.random() * hearts.length)];
            heart.style.left = Math.random() * 100 + '%';
            heart.style.fontSize = (1 + Math.random() * 2) + 'rem';
            const duration = 15 + Math.random() * 15;
            heart.style.animationDuration = duration + 's';
            document.body.appendChild(heart);
            setTimeout(() => heart.remove(), duration * 1000);
        }

        setInterval(createBgHeart, 1500);
        for (let i = 0; i < 5; i++) {
            setTimeout(createBgHeart, i * 800);
        }
    </script>

</body>
  </html>
